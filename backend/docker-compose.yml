services:
  postgres:
    image: postgres:16
    container_name: finding-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finding_tracker
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - finding_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d finding_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finding_tracker_pgdata:
